<html lang="en">
  <head>

    <title>KigaliStreams - Watch Interpreted Movies (Agasobanuye) in Rwanda</title>
    <meta name="description" content="The best place to watch interpreted movies and series (Agasobanuye) in Kinyarwanda. New releases from Rocky, Savimbi, Yanga, and more." />
    <meta name="keywords" content="Kigali Streams, Agasobanuye, Kinyarwanda Movies, Rwanda Cinema, Rocky Kimomo, Yanga, Junior, Rwanda TV" />

    <link rel="manifest" href="/site.webmanifest"> 
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <meta name="msapplication-TileColor" content="#E89300"> 
    <meta name="theme-color" content="#000000" /> 

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          console.log("KigaliStreams loaded. Injecting ads safely in background...");

          // 1. Gizokraijaw (Vignette Ad)
          try {
            (function(s){
              s.dataset.zone='10182193';
              s.src='https://gizokraijaw.net/vignette.min.js';
              document.body.appendChild(s);
            })(document.createElement('script'));
          } catch(e) { console.log("Ad 1 blocked"); }

          // 2. 3nbf4 (Tag Ad)
          try {
            var tagScript = document.createElement('script');
            tagScript.src = "https://3nbf4.com/act/files/tag.min.js?z=10173715";
            tagScript.setAttribute('data-cfasync', 'false');
            tagScript.async = true;
            document.body.appendChild(tagScript);
          } catch(e) { console.log("Ad 2 blocked"); }

          // 3. al5sm (Tag Ad)
          try {
            (function(s){
              s.dataset.zone='10189306';
              s.src='https://al5sm.com/tag.min.js';
              document.body.appendChild(s);
            })(document.createElement('script'));
          } catch(e) { console.log("Ad 3 blocked"); }

        }, 3000); // 3000ms = 3 Seconds Delay
      });
    </script>
  </body>
</html>
